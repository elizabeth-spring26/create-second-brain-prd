name: Check Reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check and send due reminders
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_reminders.py

      - name: Commit updated reminders.json
        run: |
          git config user.name "second-brain-bot"
          git config user.email "actions@github.com"
          git add Elizabeth-Brain/Memory/reminders.json
          git diff --cached --quiet || git commit -m "Send due reminders"
          git diff --cached --quiet || git push
