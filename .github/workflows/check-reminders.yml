name: Check Reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check and send due reminders
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_reminders.py

      - name: Commit updated reminders.json
        run: |
          git config user.name "second-brain-bot"
          git config user.email "actions@github.com"
          git add Elizabeth-Brain/Memory/reminders.json
          # If there are staged changes, commit AND push. The previous version
          # checked `git diff --cached --quiet` again before pushing, but after
          # the commit nothing is staged, so that check passed and the push was
          # skipped — the "sent" status never reached remote and reminders
          # re-fired every run. Guard once, then do both.
          if git diff --cached --quiet; then
            echo "No reminder changes to commit."
          else
            git commit -m "Send due reminders"
            # The bot also writes reminders.json via the GitHub API, so remote
            # may have advanced since checkout. Rebase before pushing, and retry
            # once, so the "sent" status reliably lands on remote.
            git push || (git pull --rebase --autostash origin main && git push)
          fi
